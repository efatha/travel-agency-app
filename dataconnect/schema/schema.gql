type User @table {
  email: String!
  fullName: String!
  phoneNumber: String!
  profilePictureUrl: String
  nationality: String
}

type Package @table {
  title: String!
  description: String!
  price: Float!
  destination: String!
  startDate: Date!
  endDate: Date!
  maxCapacity: Int
  inclusions: String
  imageUrls: [String]
}

type Booking @table {
  user: User!
  package: Package!
  status: String!
  totalPaid: Float!
  bookingDate: Timestamp!
  paymentTransactionId: String
  specialRequests: String
}

type Payment @table {
  booking: Booking!
  amount: Float!
  currency: String!
  paymentMethod: String!
  paymentStatus: String!
  gatewayReferenceId: String
  processedAt: Timestamp
}

type ItineraryItem @table {
  package: Package!
  title: String!
  startTime: Timestamp!
  locationDescription: String!
  notes: String
  durationMinutes: Int
}